{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - ChatWeb</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">💬</div>
      <h2>Inscription</h2>
      <p class="auth-subtitle">Créez votre compte pour commencer</p>

      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Choisissez un nom d'utilisateur" required autofocus>
        </div>
        
        
        
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Créez un mot de passe sécurisé" required>
        </div>
        
        <button type="submit" class="auth-btn">S'inscrire</button>
      </form>

      <div class="auth-links">
        <p>Déjà un compte ? <a href="{% url 'accounts:login' %}">Se connecter</a></p>
      </div>
    </div>
  </div>

</body>
</html>
