{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Créer un salon - ChatWeb</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
    }
    
    .create-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.5s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .create-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .create-header h2 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    
    .create-header p {
      color: #666;
      font-size: 16px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #444;
      font-size: 16px;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e1e5e9;
      border-radius: 12px;
      font-size: 16px;
      transition: border 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }
    
    .btn-create {
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 30px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.5px;
    }
    
    .btn-create:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: color 0.3s;
    }
    
    .btn-back:hover {
      color: #764ba2;
      text-decoration: underline;
    }
    
    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>

  <div class="logo"> ChatWeb</div>

  <div class="create-container">
    <div class="create-header">
      <h2>Créer un nouveau salon</h2>
      <p>Discutez avec votre équipe dans un espace dédié</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="nom">Nom du salon *</label>
        <input type="text" id="nom" name="nom" placeholder="Ex: Projet Web, Général, Loisirs..." required>
      </div>
      
      <div class="form-group">
        <label for="description">Description (optionnel)</label>
        <textarea id="description" name="description" placeholder="Décrivez le thème de ce salon..."></textarea>
      </div>

      <button type="submit" class="btn-create">
        🚀 Créer le salon
      </button>
    </form>

    <a href="{% url 'chat:home' %}" class="btn-back">
      ← Retour à l'accueil
    </a>
  </div>

</body>
</html>
