{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - ChatWeb</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">💬</div>
      <h2>Connexion</h2>
      <p class="auth-subtitle">Rejoignez la conversation</p>

      {% if error %}
        <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Votre nom d'utilisateur" required autofocus>
        </div>
        
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Votre mot de passe" required>
        </div>

        <button type="submit" class="auth-btn">Se connecter</button>
      </form>

      <div class="auth-links">
        <p>Pas encore de compte ? <a href="{% url 'accounts:register' %}">S'inscrire</a></p>
      </div>
    </div>
  </div>

</body>
</html>
